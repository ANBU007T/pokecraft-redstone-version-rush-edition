[package]
name = "pokecraft-bevy"
version = "1.1.1"
edition = "2024"

[lib]
name = "pokecraft_bevy"
path = "src/lib.rs"

[[bin]]
name = "pokecraft-bevy"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
